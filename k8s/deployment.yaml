apiVersion: apps/v1
kind: Deployment
metadata:
  name: organization-service
  labels:
    app: organization-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: organization-service
  template:
    metadata:
      labels:
        app: organization-service
    spec:
      initContainers:
        - name: organization-migrate
          image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - "npx sequelize-cli db:migrate"
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: org-db
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: org-db
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: org-db
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: org-db
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: org-db
                  key: name
      containers:
        - name: organization-service
          image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
          ports:
            - containerPort: 3002
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3002"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: org-db
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: org-db
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: org-db
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: org-db
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: org-db
                  key: name
            - name: CORS_ORIGIN
              value: "https://steep-geology-napping.ngrok-free.dev"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service-node:3001"
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: organization-rabbitmq
                  key: url
            - name: INTERNAL_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: internal-service-secret
                  key: value
            - name: OTEL_SERVICE_NAME
              value: "organization-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4318"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            # Sin `limits` a proposito: un tope de CPU de 300m estrangulaba al servicio (throttle)
            # y las pruebas de stress-petitions medían el limite de Kubernetes, no la capacidad
            # del codigo, con el nodo casi ocioso. Se conservan los `requests` (reserva).
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
